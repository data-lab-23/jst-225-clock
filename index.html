<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日本標準時の現在時刻｜秒まで見やすいJSTオンライン時計</title>
    <meta
      name="description"
      content="日本標準時（JST）の現在時刻を24時間表記・秒単位で確認できる無料オンライン時計。PC、テレビ、スマートフォンの全画面表示にも対応しています。"
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#07101f" />
    <link rel="canonical" href="https://data-lab-23.github.io/jst-225-clock/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="JST 225 Clock" />
    <meta property="og:title" content="日本標準時の現在時刻｜JST 225 Clock" />
    <meta
      property="og:description"
      content="日本標準時の現在時刻を、秒まで見やすい株価ボード風デザインで表示する無料オンライン時計です。"
    />
    <meta property="og:url" content="https://data-lab-23.github.io/jst-225-clock/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="日本標準時の現在時刻｜JST 225 Clock" />
    <meta
      name="twitter:description"
      content="日本標準時の現在時刻を24時間表記・秒単位で確認。全画面表示にも対応した無料オンライン時計です。"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "JST 225 Clock",
        "alternateName": "日本標準時の現在時刻",
        "url": "https://data-lab-23.github.io/jst-225-clock/",
        "description": "日本標準時の現在時刻を24時間表記・秒単位で確認できる無料のオンライン時計です。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "JavaScript enabled",
        "inLanguage": ["ja", "en"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <main id="app" aria-busy="true">
      <section class="clock-board" aria-labelledby="clock-title-ja">
        <header class="clock-header">
          <div class="clock-title-group">
            <p class="clock-title-ja" data-clock-field="title-ja" id="clock-title-ja">日本標準時</p>
            <h1 class="clock-title-en" data-clock-field="title-en">Japan Standard Time 225</h1>
            <span class="live-indicator" aria-hidden="true"><i></i> LIVE</span>
          </div>
          <button id="settings-trigger" type="button" aria-label="表示設定を開く">設定</button>
        </header>

        <div class="clock-panel">
          <section class="primary-time" aria-labelledby="time-label">
            <p class="field-label" id="time-label"><span lang="ja">現在時刻</span><span lang="en">Current Time</span></p>
            <div class="primary-value-frame">
              <span class="primary-value" data-clock-field="time">--:--</span>
              <span class="primary-value-ghost" aria-hidden="true">--:--</span>
            </div>
          </section>

          <dl class="clock-rows">
            <div class="clock-row date-row">
              <dt class="field-label"><span lang="ja">日付</span><span lang="en">Date</span></dt>
              <dd><span data-clock-field="date">----</span></dd>
            </div>
            <div class="clock-row">
              <dt class="field-label"><span lang="ja">曜日</span><span lang="en">Day</span></dt>
              <dd><span data-clock-field="weekday">----</span></dd>
            </div>
            <div class="clock-row">
              <dt class="field-label"><span lang="ja">秒</span><span lang="en">Seconds</span></dt>
              <dd><span data-clock-field="seconds">--</span></dd>
            </div>
            <div class="clock-row">
              <dt class="field-label"><span lang="ja">時間帯</span><span lang="en">Time Zone</span></dt>
              <dd><span data-clock-field="zone">Asia/Tokyo（JST）</span></dd>
            </div>
          </dl>
        </div>
      </section>

      <p class="app-status" role="status" aria-live="polite"></p>

      <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-dialog-title" hidden>
        <h2 id="settings-dialog-title">表示設定</h2>
        <p class="settings-dialog__description">変更はすぐに時計へ反映されます。</p>

        <div class="settings-dialog__fields">
          <div class="settings-field">
            <label for="settings-text-scale">文字サイズ</label>
            <input id="settings-text-scale" type="range" min="0.8" max="1.4" step="0.05" value="1" />
          </div>
          <div class="settings-field">
            <label for="settings-display-scale">表示サイズ</label>
            <input id="settings-display-scale" type="range" min="0.8" max="1.4" step="0.05" value="1" />
          </div>
          <div class="settings-field">
            <label for="settings-panel-color">青いパネルの色</label>
            <input id="settings-panel-color" type="color" value="#0669f5" />
          </div>
          <div class="settings-field">
            <label for="settings-accent-color">赤いアクセントの色</label>
            <input id="settings-accent-color" type="color" value="#ed354e" />
          </div>
          <div class="settings-field">
            <label for="settings-text-color">文字色</label>
            <input id="settings-text-color" type="color" value="#f7ffff" />
          </div>
        </div>

        <div class="settings-dialog__actions">
          <button id="settings-fullscreen" type="button">全画面表示</button>
          <button id="settings-reset" type="button">初期設定に戻す</button>
          <button id="settings-close" type="button">閉じる</button>
        </div>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
